name: Release Tauri App

on:
  push:
    branches:
      - main

jobs:
  build-tauri:
    permissions:
      contents: write # 允许写入 releases
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

  - name: Install Rust toolchain
    uses: actions-rs/toolchain@v1
    with:
      toolchain: stable
      profile: minimal
      override: true
  
  # ⬇️ 修复 PATH 错误的重点：先设置 pnpm
  - uses: pnpm/action-setup@v3
    name: Set up pnpm CLI
    with:
      version: 8

  # ⬇️ 其次设置 Node.js，以便它能正确利用 pnpm 缓存
  - name: Install Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: 'pnpm' # 启用缓存

  - name: Install frontend dependencies
    run: pnpm install # 此时 pnpm 应该已在 PATH 中

  - name: Build the application (Windows)
    run: pnpm tauri build

  - name: Upload release assets
    uses: softprops/action-gh-release@v1
    with:
      tag_name: ${{ github.ref_name }}
      name: Release ${{ github.ref_name }}
      files: |
        src-tauri/target/release/bundle/*/*.exe
        src-tauri/target/release/bundle/*/*.msi
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}��通配符捕获 Windows 安装器 (MSI 和 NSIS .exe)
          files: |
            src-tauri/target/release/bundle/*/*.exe
            src-tauri/target/release/bundle/*/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 }}
